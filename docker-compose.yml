services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vivienda_match
      POSTGRES_USER: vivienda
      POSTGRES_PASSWORD: vivienda
    ports:
      - "5432:5432"
    volumes:
      - vivienda_match_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivienda -d vivienda_match"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://vivienda:vivienda@postgres:5432/vivienda_match
      CORS_ORIGINS: http://localhost:3000
      LLM_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  vivienda_match_pg:
